<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>ELS.ID Workflow</title>

<!--
  PEMBUNGKUS APLIKASI

  Halaman ini isinya hampir kosong: tugasnya cuma memuat aplikasi
  Apps Script di dalamnya, lalu memberi tahu HP bahwa ini aplikasi
  yang bisa dipasang.

  Yang didapat dari membungkus seperti ini:

    - ikon sendiri di layar utama, bukan ikon Chrome
    - tidak ada batang alamat dan tidak ada tulisan
      "Aplikasi ini dibuat oleh pengguna Google Apps Script"
    - terbuka seperti aplikasi biasa, bukan seperti situs

  Yang TIDAK berubah: datanya tetap di Google, loginnya tetap sama,
  dan setiap deploy baru langsung terpakai tanpa memasang ulang.
-->

<meta name="theme-color" content="#E8590C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ELS.ID">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root { --brand: #E8590C }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #app {
    display: block;
    border: 0;
    width: 100%;
    height: 100%;
  }

  /* Layar muat, dibuat sama dengan yang di dalam aplikasinya */
  #muat {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    z-index: 10;
    transition: opacity .25s ease;
  }
  #muat.pergi { opacity: 0; pointer-events: none }

  .logo {
    color: var(--brand);
    background: #FFF1E8;
    width: 92px; height: 92px;
    border-radius: 26px;
    display: grid;
    place-content: center;
  }

  #muat b { font-size: 19px; font-weight: 800; color: #1A1D23 }
  #muat span { color: #71798A; font-size: 13px }

  .bar {
    margin-top: 14px;
    width: 168px; height: 4px;
    border-radius: 99px;
    background: #E4E7EC;
    overflow: hidden;
  }
  .bar i {
    display: block;
    width: 42%; height: 100%;
    border-radius: 99px;
    background: var(--brand);
    animation: geser 1s ease-in-out infinite;
  }
  @keyframes geser {
    0%   { transform: translateX(-100%) }
    100% { transform: translateX(240%) }
  }

  #gagal { display: none; text-align: center; padding: 0 28px }
  #gagal a { color: var(--brand); font-weight: 700 }

  /* Lapisan tanya sidik jari — muncul di atas aplikasinya */
  #sidik-tanya {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(17, 23, 34, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .sidik-kotak {
    background: #fff;
    border-radius: 18px;
    padding: 26px 22px 20px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 24px 60px rgba(17, 23, 34, .3);
  }

  .sidik-kotak b { font-size: 17px; color: #1A1D23 }
  .sidik-kotak span { font-size: 13px; color: #71798A; line-height: 1.5 }

  .sidik-ok {
    margin-top: 10px;
    background: var(--brand);
    color: #fff;
    border: 0;
    border-radius: 11px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .sidik-ok:disabled { opacity: .6 }

  .sidik-batal {
    background: none;
    border: 0;
    color: #71798A;
    font-size: 13px;
    padding: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="muat">
  <div class="logo">
    <svg viewBox="0 0 48 48" width="58" height="58" aria-hidden="true">
      <path d="M6 40V20l10-7 10 7v20" fill="none" stroke="currentColor"
        stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M26 40V14l8-5 8 5v26" fill="none" stroke="currentColor"
        stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M12 40v-9h8v9M32 40v-7h6v7" fill="none" stroke="currentColor"
        stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M3 40h42" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
  </div>
  <b>ELS.ID Purwokerto</b>
  <span id="pesan">Menyiapkan layar…</span>
  <div class="bar"><i></i></div>

  <div id="gagal">
    <p style="color:#71798A;font-size:13px;line-height:1.5">
      Aplikasi lama dimuat. Pastikan HP tersambung internet, lalu tutup
      dan buka lagi.
    </p>
    <p id="alasan" style="color:#C62828;font-size:12px;line-height:1.5"></p>
    <a id="buka-langsung" href="#" target="_blank">Buka lewat browser</a>
  </div>
</div>

<!--
  Izin sidik jari diteruskan ke bingkai di dalamnya.

  Tanpa dua izin terakhir, peramban menolak permintaan sidik jari
  dari halaman di dalam bingkai — itu aturan keamanan bawaan, dan
  izinnya memang harus diberikan dari luar seperti ini.
-->
<iframe id="app" title="ELS.ID Workflow"
        allow="clipboard-write; autoplay;
               publickey-credentials-create *;
               publickey-credentials-get *"></iframe>

<script>
/* ============================================================
   ALAMAT APLIKASI

   Ganti baris di bawah dengan alamat /exec dari deploy Apps
   Script. Ambil dari Apps Script → Deploy → Kelola deployment →
   salin URL Web app.

   Alamatnya berakhiran /exec, bukan /dev. Yang /dev hanya bisa
   dibuka oleh pemilik skripnya sendiri.
   ============================================================ */
var ALAMAT = 'https://script.google.com/macros/s/AKfycbztPv_SAjUrrTHLwBCIUJ3aYEXrcDPeIxRISCF34cnY95FDH7y-Syb2CLYxFSKJDds2/exec';

(function () {
  var bingkai = document.getElementById('app');
  var muat = document.getElementById('muat');
  var gagal = document.getElementById('gagal');
  var pesan = document.getElementById('pesan');

  document.getElementById('buka-langsung').href = ALAMAT;

  if (ALAMAT.indexOf('GANTI_DENGAN') === 0) {
    pesan.textContent = 'Alamat aplikasi belum diisi di index.html';
    document.querySelector('.bar').style.display = 'none';
    return;
  }

  bingkai.src = ALAMAT;
  bingkai.addEventListener('load', function () { bingkai.dataset.siap = '1'; });

  /*
   * Layar muat disingkirkan setelah isinya tampil.
   *
   * Ditunggu sebentar setelah iframe selesai, karena aplikasinya
   * masih menggambar isinya sendiri — kalau langsung disingkirkan,
   * yang terlihat layar putih kosong sesaat.
   */
  function singkirkanMuat() {
    if (muat.classList.contains('pergi')) return;
    muat.classList.add('pergi');
    setTimeout(function () { muat.style.display = 'none'; }, 250);
  }

  bingkai.onload = function () {
    /*
     * Jeda dipendekkan jadi seperempat detik.
     *
     * Jeda ini cuma menutupi kedipan saat aplikasinya menggambar
     * isi pertamanya. Lebih dari itu, yang terjadi orang menatap
     * layar yang sebenarnya sudah siap.
     */
    setTimeout(singkirkanMuat, 250);
  };

  /*
   * Paling lama tiga detik, apa pun yang terjadi.
   *
   * Kalau sampai segitu belum tampil juga, lebih baik aplikasinya
   * yang terlihat — walau masih setengah jadi — daripada layar
   * muat yang tidak memberi tahu apa-apa.
   */
  setTimeout(singkirkanMuat, 3000);

  // Kalau lebih dari 20 detik belum tampil juga, beri jalan keluar
  setTimeout(function () {
    if (bingkai.dataset.siap === '1') return;
    pesan.textContent = 'Aplikasi lama dimuat';
    gagal.style.display = 'block';
    muat.classList.remove('pergi');
    muat.style.display = 'flex';

    /*
     * Alasan yang paling mungkin, supaya tidak perlu menebak.
     *
     * Dua kesalahan ini yang hampir selalu terjadi saat pertama
     * memasang, dan keduanya tidak kelihatan dari layar putih.
     */
    var a = document.getElementById('alasan');
    if (ALAMAT.indexOf('/exec') < 0) {
      a.textContent = 'Alamatnya tidak berakhiran /exec — yang /dev ' +
        'hanya bisa dibuka pemilik skripnya.';
    } else {
      a.textContent = 'Kemungkinan deploy Apps Script belum disetel ' +
        'Who has access: Anyone.';
    }
  }, 20000);

  /* ============================================================
     PENITIPAN SIMPANAN

     Aplikasi di dalam bingkai milik Google, pembungkus ini milik
     kita. Bagi peramban keduanya dua tempat berbeda — dan Safari
     di iPhone menghapus simpanan milik bingkai di dalam setiap
     kali aplikasinya ditutup.

     Itu sebabnya iPhone selalu diminta login ulang sementara
     Android tidak.

     Jadi simpanannya dititipkan ke sini. Yang dititipkan hanya
     token login dan pengaturan kecil milik perangkat — tidak ada
     data transaksi, tidak ada PIN.
     ============================================================ */
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.els) return;

    // Diingat supaya jawabannya sampai ke lapisan yang benar
    penanya = e.source;

    try {
      if (d.els === 'ambil') {
        var isi = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('els_') === 0) isi[k] = localStorage.getItem(k);
        }
        (e.source || bingkai.contentWindow).postMessage({ els: 'data', data: isi }, '*');
        return;
      }

      if (d.els === 'simpan' && d.k) { localStorage.setItem(d.k, d.v); return; }
      if (d.els === 'hapus' && d.k) { localStorage.removeItem(d.k); return; }

      /* ----------------------------------------------------------
         SIDIK JARI DIKERJAKAN DI SINI, BUKAN DI DALAM BINGKAI

         Dua alasan.

         Pertama, peramban menolak permintaan sidik jari dari dalam
         bingkai milik asal lain — walau izinnya sudah diteruskan,
         sebagian peramban tetap menolaknya.

         Kedua, kunci sidik jari terikat pada nama situs. Alamat
         Google untuk aplikasi ini bisa berganti sewaktu-waktu, dan
         begitu berganti, kunci yang sudah terdaftar tidak dikenali
         lagi. Alamat halaman ini tidak pernah berganti.
         ---------------------------------------------------------- */
      /* Pemeriksaan cepat: pembungkus ini versi berapa */
      if (d.els === 'versi') {
        (e.source || bingkai.contentWindow).postMessage({ els: 'versi-hasil', v: 6 }, '*');
        return;
      }

      if (d.els === 'sidik-daftar' || d.els === 'sidik-minta') {
        /*
         * Diakui dulu bahwa permintaannya sampai.
         *
         * Tanpa ini aplikasi di dalam tidak bisa membedakan dua
         * keadaan: pembungkusnya versi lama yang tidak mengenali
         * permintaan ini, atau orangnya yang masih memandangi
         * kotak sidik jari. Keduanya terlihat sama — menunggu.
         */
        try {
          (e.source || bingkai.contentWindow).postMessage({ els: 'sidik-ack' }, '*');
        } catch (e2) {}

        /*
         * Harus ada ketukan di halaman INI dulu.
         *
         * Peramban hanya mengizinkan permintaan sidik jari kalau
         * orangnya baru saja menyentuh halaman yang memintanya.
         * Ketukan tadi terjadi di dalam bingkai — bagi peramban itu
         * halaman lain, jadi permintaannya menggantung tanpa
         * jawaban sampai waktunya habis.
         *
         * Jadi tombolnya dimunculkan di sini, dan ketukan pada
         * tombol itulah yang menjalankannya.
         */
        tawarkanSidik(d);
        return;
      }
    } catch (err) {}
  });

  function acak(n) {
    var a = new Uint8Array(n);
    crypto.getRandomValues(a);
    return a;
  }

  /*
   * Jawaban dikirim ke yang bertanya, bukan ke bingkai terluar.
   *
   * Aplikasinya berada dua lapis di dalam: pembungkus ini memuat
   * bingkai Google, dan Google memuat bingkai aplikasinya sendiri.
   * Mengirim ke bingkai terluar berarti jawabannya berhenti di
   * tengah dan tidak pernah sampai.
   */
  var penanya = null;

  function balas(jenis, ok, pesan, id) {
    var tujuan = penanya || (bingkai.contentWindow);
    try {
      tujuan.postMessage(
        { els: jenis, ok: !!ok, pesan: pesan || '', id: id || '' }, '*');
    } catch (e) {}
  }

  /** Lapisan bertombol, supaya ketukannya terjadi di halaman ini */
  function tawarkanSidik(d) {
    var daftar = d.els === 'sidik-daftar';
    var lama = document.getElementById('sidik-tanya');
    if (lama && lama.parentNode) lama.parentNode.removeChild(lama);

    var box = document.createElement('div');
    box.id = 'sidik-tanya';
    box.innerHTML =
      '<div class="sidik-kotak">' +
        '<div style="font-size:34px">👆</div>' +
        '<b>' + (daftar ? 'Nyalakan sidik jari' : 'Masuk dengan sidik jari') + '</b>' +
        '<span>Ketuk tombol di bawah, lalu ikuti petunjuk perangkat Anda.</span>' +
        '<button class="sidik-ok">' +
          (daftar ? 'Lanjutkan' : 'Buka sekarang') + '</button>' +
        '<button class="sidik-batal">Nanti saja</button>' +
      '</div>';

    document.body.appendChild(box);

    box.querySelector('.sidik-ok').onclick = function () {
      box.querySelector('.sidik-ok').textContent = 'Menunggu perangkat…';
      box.querySelector('.sidik-ok').disabled = true;
      tanganiSidik(d, box);
    };

    box.querySelector('.sidik-batal').onclick = function () {
      tutupSidik(box);
      balas(d.els + '-hasil', false, 'Dibatalkan.');
    };
  }

  function tutupSidik(box) {
    if (box && box.parentNode) box.parentNode.removeChild(box);
  }

  function tanganiSidik(d, box) {
    if (!window.PublicKeyCredential || !navigator.credentials) {
      tutupSidik(box);
      return balas(d.els + '-hasil', false, 'Perangkat ini tidak mendukung sidik jari.');
    }

    if (d.els === 'sidik-daftar') {
      navigator.credentials.create({
        publicKey: {
          challenge: acak(32),
          rp: { name: 'ELS.ID Workflow' },
          user: {
            id: acak(16),
            name: String(d.nama || 'pengguna'),
            displayName: String(d.tampil || 'Pengguna')
          },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 },
                             { type: 'public-key', alg: -257 }],
          authenticatorSelection: {
            authenticatorAttachment: 'platform',
            userVerification: 'required',
            residentKey: 'preferred'
          },
          timeout: 60000,
          attestation: 'none'
        }
      }).then(function (cred) {
        if (!cred) throw new Error('Dibatalkan.');
        var id = btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId)));
        localStorage.setItem('els_sidik', id);
        tutupSidik(box);
        balas('sidik-daftar-hasil', true, '', id);
      }).catch(function (e) {
        tutupSidik(box);
        balas('sidik-daftar-hasil', false, String(e && e.message ? e.message : e));
      });
      return;
    }

    var simpan = localStorage.getItem('els_sidik');
    if (!simpan) {
      return balas('sidik-minta-hasil', false, 'Belum dinyalakan di perangkat ini.');
    }

    var biner = Uint8Array.from(atob(simpan), function (c) { return c.charCodeAt(0); });

    navigator.credentials.get({
      publicKey: {
        challenge: acak(32),
        allowCredentials: [{ type: 'public-key', id: biner }],
        userVerification: 'required',
        timeout: 60000
      }
    }).then(function (hasil) {
      if (!hasil) throw new Error('Dibatalkan.');
      tutupSidik(box);
      balas('sidik-minta-hasil', true);
    }).catch(function (e) {
      tutupSidik(box);
      balas('sidik-minta-hasil', false, String(e && e.message ? e.message : e));
    });
  }

  /*
   * Simpanan dikirim ulang saat aplikasi kembali dibuka.
   *
   * Di iPhone, aplikasi yang lama ditinggalkan dimuat ulang dari
   * awal saat dibuka kembali — tanpa sempat meminta simpanannya.
   * Dikirim dari sini begitu halamannya terlihat lagi, jadi
   * tokennya tetap sampai.
   */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;

    try {
      var isi = {};
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('els_') === 0) isi[k] = localStorage.getItem(k);
      }
      (penanya || bingkai.contentWindow).postMessage({ els: 'data', data: isi }, '*');
    } catch (err) {}
  });

  // Pendaftaran service worker — ini yang membuatnya bisa dipasang
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>

</body>
</html>
